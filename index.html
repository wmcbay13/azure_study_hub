<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Interactive AZ-104 Azure Administrator study platform: topics, diagrams, flashcards, practice questions and exams." />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>Azure Study Hub</title>
    <script>
      try {
        var t = localStorage.getItem('ash-theme');
        var dark = t === 'dark' || ((!t || t === 'system') && matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
